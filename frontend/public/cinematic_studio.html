<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sacred Friends — 16:9 Cinematic 3D Motion Video Studio</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050204;
      font-family: 'Outfit', sans-serif;
      color: #faf5ed;
    }

    .video-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* Fixed 16:9 Aspect Ratio Container */
    .canvas-container {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      /* 16:9 */
      max-height: 100vh;
      max-width: 177.78vh;
      /* 16:9 */
      margin: auto;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.9);
      background: #080305;
    }

    canvas#cinematic-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Floating Cinematic Overlay Controls (Autohides) */
    .cinematic-hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem 2.5rem;
      transition: opacity 0.4s ease;
      z-index: 100;
    }

    .cinematic-hud.fade-out {
      opacity: 0;
    }

    .hud-interactive {
      pointer-events: auto;
    }

    /* Top Bar */
    .hud-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-brand {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(14, 6, 9, 0.75);
      padding: 0.6rem 1.25rem;
      border-radius: 9999px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      backdrop-filter: blur(12px);
    }

    .hud-brand img {
      height: 28px;
    }

    .hud-title {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      color: #faf5ed;
      letter-spacing: 0.05em;
    }

    .hud-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.65rem;
      border-radius: 9999px;
      background: rgba(212, 175, 55, 0.18);
      color: #fef08a;
      letter-spacing: 0.08em;
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    .btn-hud {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.35rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 9999px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      background: rgba(18, 8, 12, 0.85);
      color: #faf5ed;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-hud:hover {
      background: rgba(45, 18, 28, 0.95);
      border-color: #d4af37;
      color: #fef08a;
      transform: translateY(-2px);
    }


  </style>
</head>

<body>
  <div class="video-viewport">
    <div class="canvas-container">
      <canvas id="cinematic-canvas" width="1920" height="1080"></canvas>
    </div>
  </div>

  <!-- Autohiding Floating HUD Controls -->
  <div class="cinematic-hud" id="cinematic-hud">
    <div class="hud-top-bar hud-interactive">
      <div class="hud-brand">
        <img src="/assets/q_cubic_logo.png" alt="Q-CUBIC">
        <span class="hud-title">Sacred Friends</span>
        <span class="hud-badge">16:9 CINEMATIC 3D MOTION</span>
      </div>

      <div style="display: flex; gap: 0.75rem;">
        <button type="button" class="btn-hud" id="btn-fullscreen" title="Toggle Fullscreen">
          ⛶ Fullscreen
        </button>
        <a href="/" class="btn-hud" title="Return to Website">
          ← Return to Website
        </a>
      </div>
    </div>
  </div>

  <script src="/assets/cinematicMotionEngine.js"></script>
  <script>
    const canvas = document.getElementById('cinematic-canvas');
    const hud = document.getElementById('cinematic-hud');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    const engine = new window.CinematicMotionEngine(canvas, { autoStart: true });

    // Fullscreen Toggle
    btnFullscreen?.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => { });
      } else {
        document.exitFullscreen().catch(() => { });
      }
    });

    // Expose headless recording hook for automated pipeline
    window.startHeadlessRender = function (durationSeconds = 25) {
      window.__recordedVideoBase64 = null;
      window.__renderProgress = 0;
      console.log(`[Headless] Starting render for ${durationSeconds}s...`);

      engine.recordVideo(
        durationSeconds,
        (progress, elapsed) => {
          window.__renderProgress = progress;
        },
        (url, blob) => {
          const reader = new FileReader();
          reader.onloadend = () => {
            const base64 = reader.result.split(',')[1];
            window.__recordedVideoBase64 = base64;
            console.log(`[Headless] Video rendered successfully. Bytes: ${blob.size}`);
          };
          reader.readAsDataURL(blob);
        }
      );
    };
    let hudTimer = null;
    function resetHudTimer() {
      hud.classList.remove('fade-out');
      if (hudTimer) clearTimeout(hudTimer);
      hudTimer = setTimeout(() => {
        if (!engine.isRecording) {
          hud.classList.add('fade-out');
        }
      }, 3500);
    }

    window.addEventListener('mousemove', resetHudTimer);
    window.addEventListener('keydown', resetHudTimer);
    resetHudTimer();
  </script>
</body>

</html>
